repos:
  - repo: https://github.com/terraform-docs/terraform-docs
    rev: v0.19.0
    hooks:
      - id: terraform-docs-go
        args: ["markdown", "table", "--output-file", "README.md", "."]
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.82.0
    hooks:
      - id: terraform_fmt
        stages: [ pre-commit ]
      - id: terraform_tflint
        stages: [ pre-commit ]
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
          - --args=--fix  # Try to fix issues automatically
        exclude: '^.github\/'  # Contains test providers, we don't need lint for that
